services:
  yolo11-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: yolo11-api:latest
    container_name: yolo11-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      YOLO_CONFIG_DIR: /tmp
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/outputs:/app/data/outputs
      - ./data/models:/app/data/models
    restart: unless-stopped
